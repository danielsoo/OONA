<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OONA</title>
<style>
  html, body { margin: 0; height: 100%; background: #080808; color: #f4f1ea; font-family: -apple-system, system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 28px; letter-spacing: 6px; margin: 0; }
  p { font-size: 16px; line-height: 1.5; color: #b9c3d6; margin: 0; max-width: 320px; }
  button { margin-top: 8px; font-size: 16px; padding: 12px 28px; border-radius: 999px; border: 1px solid #3d7dff; background: transparent; color: #f4f1ea; }
</style>
</head>
<body>
<main>
  <h1>OONA</h1>
  <p>You're offline. Check your connection and try again.</p>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" onclick="window.location.reload()">Try again · 다시 시도</button>
</main>
</body>
</html>
